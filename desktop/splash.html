<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Castle CRM</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(40rem 26rem at 50% 42%, rgb(232 38 42 / 0.16), transparent 70%), #0a0808;
      color: #f7f3f1; font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    svg { height: 148px; width: auto; animation: breathe 3s ease-in-out infinite; }
    .name { margin: 22px 0 0; padding-left: 0.3em; font-size: 19px; font-weight: 600; letter-spacing: 0.3em; }
    .status { margin: 10px 0 0; color: #a89f9c; font-size: 13px; }
    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 8px 28px rgb(232 38 42 / 0.28)); transform: translateY(0); }
      50% { filter: drop-shadow(0 12px 44px rgb(232 38 42 / 0.55)); transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
  </style>
</head>
